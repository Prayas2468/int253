<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img" aria-label="AI scanning a land map and documents">
  <defs>
    <linearGradient id="hiSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAF2FC"/><stop offset="1" stop-color="#F8FBFF"/>
    </linearGradient>
    <linearGradient id="hiBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4A8BDB"/><stop offset="1" stop-color="#2457A6"/>
    </linearGradient>
    <linearGradient id="hiNavy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2457A6"/><stop offset="1" stop-color="#17365D"/>
    </linearGradient>
    <linearGradient id="hiGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8FD6B4"/><stop offset="1" stop-color="#3EA97B"/>
    </linearGradient>
    <linearGradient id="hiCoral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8B97"/><stop offset="1" stop-color="#E94B5A"/>
    </linearGradient>
    <filter id="hiShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#17365D" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="640" height="480" rx="28" fill="url(#hiSky)"/>
  <circle cx="92" cy="86" r="64" fill="#DCEAFA"/>
  <circle cx="560" cy="404" r="86" fill="#E3F4EC" opacity="0.8"/>

  <!-- Isometric land parcels -->
  <g transform="translate(52 168)" filter="url(#hiShadow)">
    <polygon points="0,96 170,20 340,96 170,172" fill="url(#hiGreen)" opacity="0.9"/>
    <polygon points="0,96 170,20 340,96 170,172" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.6"/>
    <g fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.55">
      <path d="M85 58L255 134"/>
      <path d="M42 77L212 153"/>
      <path d="M128 39L298 115"/>
      <path d="M170 20L170 96M85 58L85 134M255 58L255 134"/>
    </g>
    <polygon points="170,172 340,96 340,116 170,192" fill="#2F8C66" opacity="0.85"/>
    <polygon points="0,96 170,172 170,192 0,116" fill="#3EA97B" opacity="0.85"/>
  </g>

  <!-- Map pin -->
  <g transform="translate(300 120)" filter="url(#hiShadow)">
    <path d="M30 0c17 0 30 13 30 30 0 22-30 52-30 52S0 52 0 30C0 13 13 0 30 0z" fill="url(#hiCoral)"/>
    <circle cx="30" cy="30" r="11" fill="#FFFFFF"/>
    <circle cx="30" cy="30" r="5" fill="#E94B5A"/>
  </g>

  <!-- Document card -->
  <g transform="translate(372 92) rotate(5)" filter="url(#hiShadow)">
    <rect width="190" height="240" rx="16" fill="#FFFFFF"/>
    <rect x="0" y="0" width="190" height="10" rx="5" fill="url(#hiBlue)"/>
    <rect x="22" y="34" width="96" height="12" rx="6" fill="#17365D"/>
    <rect x="22" y="56" width="140" height="8" rx="4" fill="#DCE6F2"/>
    <rect x="22" y="74" width="120" height="8" rx="4" fill="#DCE6F2"/>
    <rect x="22" y="104" width="146" height="1.5" fill="#E4EBF4"/>
    <g fill="#EEF4FB">
      <rect x="22" y="118" width="146" height="22" rx="6"/>
      <rect x="22" y="148" width="146" height="22" rx="6"/>
      <rect x="22" y="178" width="100" height="22" rx="6"/>
    </g>
    <g fill="#9DB4CE">
      <rect x="32" y="126" width="54" height="6" rx="3"/>
      <rect x="32" y="156" width="68" height="6" rx="3"/>
      <rect x="32" y="186" width="42" height="6" rx="3"/>
    </g>
    <g fill="url(#hiGreen)">
      <rect x="132" y="122" width="28" height="14" rx="7"/>
      <rect x="132" y="152" width="28" height="14" rx="7"/>
    </g>
  </g>

  <!-- AI scan frame -->
  <g transform="translate(118 66)" fill="none" stroke="url(#hiNavy)" stroke-width="6" stroke-linecap="round">
    <path d="M0 34V6a6 6 0 0 1 6-6h28"/>
    <path d="M138 0h28a6 6 0 0 1 6 6v28"/>
    <path d="M172 138v28a6 6 0 0 1-6 6h-28"/>
    <path d="M34 172H6a6 6 0 0 1-6-6v-28"/>
  </g>
  <rect x="118" y="66" width="172" height="172" fill="none" stroke="#4A8BDB" stroke-width="2" stroke-dasharray="6 8" opacity="0.5"/>
  <rect x="118" y="140" width="172" height="4" fill="#E94B5A" opacity="0.55"/>

  <!-- AI chip -->
  <g transform="translate(72 82)" filter="url(#hiShadow)">
    <rect width="74" height="74" rx="18" fill="url(#hiNavy)"/>
    <rect x="16" y="16" width="42" height="42" rx="10" fill="none" stroke="#8FBCF2" stroke-width="2.5"/>
    <circle cx="37" cy="37" r="7" fill="#E94B5A"/>
    <g stroke="#8FBCF2" stroke-width="2.5" stroke-linecap="round">
      <path d="M16 8v8M37 8v8M58 8v8M16 58v8M37 58v8M58 58v8M8 16h8M8 37h8M8 58h8M58 16h8M58 37h8M58 58h8"/>
    </g>
  </g>

  <!-- Floating status chips -->
  <g transform="translate(408 330)" filter="url(#hiShadow)">
    <rect width="170" height="52" rx="14" fill="#FFFFFF"/>
    <circle cx="28" cy="26" r="12" fill="#E4F7EF"/>
    <path d="M22 26l4 4 8-8" fill="none" stroke="#1F9D6B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="50" y="15" width="82" height="8" rx="4" fill="#17365D"/>
    <rect x="50" y="30" width="56" height="6" rx="3" fill="#B9C9DC"/>
  </g>
  <g transform="translate(56 380)" filter="url(#hiShadow)">
    <rect width="150" height="50" rx="14" fill="#FFFFFF"/>
    <rect x="14" y="14" width="22" height="22" rx="7" fill="#E8F0FB"/>
    <path d="M20 28l5-8 5 5 4-3" fill="none" stroke="#2457A6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="46" y="14" width="64" height="7" rx="3.5" fill="#17365D"/>
    <rect x="46" y="28" width="86" height="6" rx="3" fill="#C7D5E5"/>
  </g>
</svg>
