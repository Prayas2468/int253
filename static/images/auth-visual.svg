<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" width="900" height="1100" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Land records and cadastral map">
  <defs>
    <linearGradient id="avBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4A2522"/><stop offset="0.55" stop-color="#4A2522"/><stop offset="1" stop-color="#241816"/>
    </linearGradient>
    <linearGradient id="avDoc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FDF4ED"/>
    </linearGradient>
    <linearGradient id="avGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0C15C"/><stop offset="1" stop-color="#C9922E"/>
    </linearGradient>
    <pattern id="avGrid" width="70" height="70" patternUnits="userSpaceOnUse">
      <path d="M70 0H0v70" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="900" height="1100" fill="url(#avBg)"/>
  <rect width="900" height="1100" fill="url(#avGrid)"/>

  <!-- contour lines -->
  <g fill="none" stroke="#F4A261" stroke-width="1.4" opacity="0.16">
    <path d="M-40 240c120-60 260 40 380-10s260-100 600-30"/>
    <path d="M-40 290c130-58 270 42 390-8s260-96 600-28"/>
    <path d="M-40 340c140-56 280 44 400-6s260-92 600-26"/>
    <path d="M-40 860c150-70 300 50 430-6s250-90 560-24"/>
    <path d="M-40 912c160-66 310 48 440-4s250-86 560-22"/>
    <path d="M-40 964c170-62 320 46 450-2s250-82 560-20"/>
  </g>

  <!-- cadastral parcels -->
  <g transform="translate(96 700)" opacity="0.9">
    <polygon points="0,120 180,36 360,120 180,204" fill="#D97736" opacity="0.28"/>
    <polygon points="0,120 180,36 360,120 180,204" fill="none" stroke="#F4A261" stroke-width="2.4" opacity="0.7"/>
    <g fill="none" stroke="#F4A261" stroke-width="1.4" opacity="0.5">
      <path d="M90 78l180 84M45 99l180 84M135 57l180 84M180 36v168M90 78v168M270 78v168"/>
    </g>
    <circle cx="180" cy="120" r="10" fill="#E94B5A"/>
    <circle cx="180" cy="120" r="22" fill="none" stroke="#E94B5A" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- document stack -->
  <g transform="translate(170 210)">
    <rect x="46" y="46" width="400" height="520" rx="22" fill="#FFFFFF" opacity="0.16"/>
    <rect x="23" y="23" width="400" height="520" rx="22" fill="#FFFFFF" opacity="0.28"/>
    <g transform="rotate(-3 200 260)">
      <rect width="400" height="520" rx="22" fill="url(#avDoc)" filter="drop-shadow(0 24px 40px rgba(0,0,0,.35))"/>
      <rect width="400" height="14" rx="7" fill="url(#avGold)"/>
      <text x="36" y="76" font-family="Poppins, Inter, Segoe UI, sans-serif" font-size="24" font-weight="800" fill="#4A2522">RECORD OF RIGHTS</text>
      <text x="36" y="104" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#6B726B">Government of India · Land Records</text>
      <rect x="36" y="128" width="328" height="1.5" fill="#F5E4DA"/>
      <g fill="#D8C3B8" font-family="Inter, Segoe UI, sans-serif" font-size="11">
        <text x="36" y="160">SURVEY NO.</text>
        <text x="36" y="204">DISTRICT</text>
        <text x="36" y="248">AREA</text>
        <text x="36" y="292">OWNER</text>
      </g>
      <g fill="#4A2522" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="700">
        <text x="150" y="160">142 / 2</text>
        <text x="150" y="204">Pune</text>
        <text x="150" y="248">1.25 acres</text>
        <text x="150" y="292">R. Deshmukh</text>
      </g>
      <g fill="#FDF4ED">
        <rect x="36" y="330" width="328" height="40" rx="8"/>
        <rect x="36" y="382" width="328" height="40" rx="8"/>
      </g>
      <g fill="#C9A89A">
        <rect x="50" y="345" width="140" height="8" rx="4"/>
        <rect x="50" y="397" width="180" height="8" rx="4"/>
      </g>
      <g fill="#1F9D6B">
        <rect x="290" y="344" width="60" height="16" rx="8"/>
        <rect x="290" y="396" width="60" height="16" rx="8"/>
      </g>
      <circle cx="330" cy="470" r="34" fill="none" stroke="url(#avGold)" stroke-width="3" opacity="0.9"/>
      <circle cx="330" cy="470" r="24" fill="none" stroke="url(#avGold)" stroke-width="1.5" opacity="0.7"/>
    </g>
  </g>

  <!-- floating pin -->
  <g transform="translate(600 400)">
    <path d="M45 0c25 0 45 20 45 45 0 33-45 78-45 78S0 78 0 45C0 20 20 0 45 0z" fill="#E94B5A"/>
    <circle cx="45" cy="45" r="16" fill="#FFFFFF"/>
    <circle cx="45" cy="45" r="7" fill="#E94B5A"/>
  </g>

  <!-- seal -->
  <g transform="translate(620 830)" opacity="0.95">
    <circle cx="70" cy="70" r="68" fill="none" stroke="#F0C15C" stroke-width="3"/>
    <circle cx="70" cy="70" r="54" fill="none" stroke="#F0C15C" stroke-width="1.5" opacity="0.7"/>
    <path d="M70 40l8 18 20 3-15 14 4 20-17-10-17 10 4-20-15-14 20-3z" fill="#F0C15C"/>
    <text x="70" y="118" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#F0C15C" letter-spacing="2">VERIFIED</text>
  </g>
</svg>
