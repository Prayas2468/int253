services:
  - type: web
    name: bhoomiai-predictive-analytics
    env: python
    buildCommand: ./build.sh
    startCommand: gunicorn bhoomiai_project.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: bhoomiai-predictive-analytics.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://bhoomiai-predictive-analytics.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: bhoomiai-db
          property: connectionString

databases:
  - name: bhoomiai-db
    databaseName: bhoomiai
    user: bhoomiai
    plan: free